
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mockingjay">
  <link rel="apple-touch-icon" href="/pwa-192x192.jpg">
  <title>Mockingjay - Professional Design Editor</title>
  <script src="https://js.paystack.co/v1/inline.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @font-face {
      font-family: 'Debrosee';
      src: url('/Debrosee-ALPnL.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Pirate One';
      src: url('/PirataOne-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    body {
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      background-color: #000;
      color: white;
      touch-action: none;
    }
    
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #444; }

    .canvas-container {
      background: radial-gradient(circle at center, #1a1a1a 0%, #0a0a0a 100%);
    }

    .bottom-sheet-transition {
      transition: transform 0.4s cubic-bezier(0.33, 1, 0.68, 1);
    }
    
    * {
      -webkit-tap-highlight-color: transparent;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .animate-spin-custom { animation: spin 2s linear infinite; }

    /* Force canvas elements to be visible during capture */
    #design-canvas * {
      transform-style: preserve-3d;
      backface-visibility: hidden;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@19.0.0",
      "react/": "https://esm.sh/react@19.0.0/",
      "react-dom": "https://esm.sh/react-dom@19.0.0",
      "react-dom/": "https://esm.sh/react-dom@19.0.0/",
      "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
      "react/jsx-runtime": "https://esm.sh/react@19.0.0/jsx-runtime",
      "lucide-react": "https://esm.sh/lucide-react@0.460.0",
      "modern-screenshot": "https://esm.sh/modern-screenshot@4.4.37"
    }
  }
  </script>
  <script type="module" src="index.tsx"></script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
